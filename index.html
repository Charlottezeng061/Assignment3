<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dynamic Reading Soundtrack</title>
  <link rel="icon" type="image/x-icon" href="assets/icon/book.ico">
  <link rel="stylesheet" href="reset.css">
  <link rel="stylesheet" href="style.css">
    <script src="main.js" defer></script>
</head>

<body>
  <main>
    <header class="page-header">
    <h1>Dynamic Reading Soundtrack</h1>
<button
  id="theme-toggle"
  type="button"
  aria-label="Switch to day mode"
  aria-pressed="false"
>
  <img id="theme-icon" src="assets/icon/day.png" alt="">
</button>
</header>

    <div class="soundtrack">
       <p class="interaction-note">
  Click a sound to preview.
  <strong>Double-click the same button to try its 4 sounds.</strong>
</p>
      <fieldset>
        <legend>Genre</legend>
        <div class="options" id="genres">
          <button class="selected">Fantasy</button>
          <button>Mystery</button>
          <button>Romance</button>
          <button>Sci-Fi</button>
        </div>
      </fieldset>

      <fieldset>
        <legend>Atmosphere</legend>
        <div class="options" id="atmospheres">
          <button class="selected">Calm</button>
          <button>Dark</button>
          <button>Magical</button>
          <button>Nostalgic</button>
        </div>
      </fieldset>

<div class="player-controls">
  <div class="intensity-control">
    <label for="intensity" class="volume-label">
      <img src="assets/icon/volume.png" alt="Volume">
    </label>

    <input
      id="intensity"
      type="range"
      min="0"
      max="100"
      value="50"
    >

    <span id="intensity-value">50%</span>
  </div>

  <button id="play" type="button" aria-label="Play soundtrack">
    <img id="play-icon" src="assets/icon/play.png" alt="">
  </button>

  <div class="controls">
    <button id="random">Random</button>
    <button id="reset">Reset</button>

    <button
      id="repeat"
      type="button"
      aria-label="Repeat soundtrack"
      aria-pressed="false"
      title="Repeat off"
    >
      <img src="assets/icon/repeat.png" alt="">
    </button>
  </div>
</div>

<div class="playing-info">
  <p id="status" role="status">Ready to play</p>
  <p id="now-playing">Fantasy + Calm</p>
</div>
    </div>
  </main>
</body>
</html>
