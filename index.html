<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dynamic Reading Soundtrack</title>
  <link rel="icon" type="image/x-icon" href="assets/icon/book.ico">
  <link rel="stylesheet" href="reset.css">
  <link rel="stylesheet" href="style.css">
  <script src="main.js" defer></script>
</head>

<body>
  <main>
    <header class="page-header">
    <h1>Dynamic Reading Soundtrack</h1>

      <div class="header-actions">
    <button
      id="guide-open"
      type="button"
      aria-label="How to use"
      title="How to use"
    >
      <span aria-hidden="true">?</span>
    </button>

    <button
     id="theme-toggle"
     type="button"
     aria-label="Switch to day mode"
     aria-pressed="false"
     >
     <img id="theme-icon" src="assets/icon/day.png" alt="">
</button>
  </div>
</header>

<div class="soundtrack">
<div class="soundtrack-top">
  <div class="playing-info">
    <p id="status" role="status">Ready to play</p>
    <p id="now-playing">Fantasy + Calm</p>
    <p id="focus-time">Focus time 00:00</p>
  </div>

  <div class="playback-buttons">
  <button
      id="random"
      class="icon-button"
      type="button"
      aria-label="Random sounds"
      title="Random sounds"
    >
    <img src="assets/icon/random.png" alt="">
  </button>

<button id="play" type="button" aria-label="Play soundtrack">
        <img id="play-icon" src="assets/icon/play.png" alt="">
      </button>

<button
  id="reset"
  class="icon-button"
  type="button"
  aria-label="Reset soundtrack"
  title="Reset soundtrack"
>
  <img src="assets/icon/reset.png" alt="">
</button>
  </div>

  <div class="player-controls">
      <div class="intensity-control">
      <label for="intensity" class="volume-label">
        <img src="assets/icon/volume.png" alt="Volume">
      </label>
      <input
        id="intensity"
        type="range"
        min="0"
        max="100"
        value="50"
      >

      <span id="intensity-value">50%</span>
    </div>
    </div>
  </div>

      <fieldset>
        <legend>Genre</legend>
        <div class="options" id="genres">
          <button class="selected">Fantasy</button>
          <button>Mystery</button>
          <button>Romance</button>
          <button>Sci-Fi</button>
        </div>
      </fieldset>

      <fieldset>
        <legend>Atmosphere</legend>
        <div class="options" id="atmospheres">
          <button class="selected">Calm</button>
          <button>Dark</button>
          <button>Magical</button>
          <button>Nostalgic</button>
        </div>
      </fieldset>
</div>
</main>

  <dialog id="guide" aria-labelledby="guide-title">
    <div class="guide-header">
      <p id="guide-progress">Step 1 of 3</p>

      <button id="guide-close" type="button" aria-label="Close guide">
        Close
      </button>
    </div>

    <div class="guide-content" aria-live="polite">
      <h2 id="guide-title">Choose your sounds</h2>
      <p id="guide-text"></p>
    </div>

    <div class="guide-navigation">
      <button id="guide-back" type="button">Back</button>
      <button id="guide-next" type="button" autofocus>Next</button>
    </div>
  </dialog>

</body>
</html>
